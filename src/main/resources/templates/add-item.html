<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add product</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>
<div th:replace="layouts/header :: header"></div>

<main class="container">
  <h1>Add product</h1>
  <form  method="post">
    <input type="text" name="title" placeholder="input title">
    <input type="text" name="image" placeholder="input URL photo">
    <input type="number" name="price" placeholder="input price">
    <textarea name="info" placeholder="input information about product"></textarea>
    <button type="submit">Add</button>
  </form>
</main>
<div th:replace="layouts/footer :: footer"></div>
</body>
</html>
